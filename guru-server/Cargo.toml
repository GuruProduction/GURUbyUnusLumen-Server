[package]
name = "guru-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "GURU open server binary: public content API + community review pipeline. Publisher, not collector."

[[bin]]
name = "guru-server"
